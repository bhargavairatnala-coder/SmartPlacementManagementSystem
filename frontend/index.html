<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Placement Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Placement Management System</h1>
        <p>Manage students, companies and placements</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h2>Students</h2>
                <p id="studentCount">0</p>
            </div>

            <div class="card">
                <h2>Companies</h2>
                <p id="companyCount">0</p>
            </div>

            <div class="card">
                <h2>Applications</h2>
                <p id="applicationCount">0</p>
            </div>

            <div class="card">
                <h2>Selected</h2>
                <p id="selectedCount">0</p>
            </div>

        </section>


        <section class="menu">

            <button onclick="showStudents()">
                View Students
            </button>

            <button onclick="showCompanies()">
                View Companies
            </button>

            <button onclick="showPlacements()">
                View Placements
            </button>

        </section>


        <section id="content">

            <h2>Welcome</h2>

            <p>
                Select an option above to manage placement information.
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
